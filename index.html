<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC冒险者模拟器</title>
<style>
  :root{
    --bg:#14171c; --panel:#1e232b; --panel2:#252b34; --line:#39414d;
    --txt:#d6dbe2; --dim:#8892a0; --green:#6ab04c; --gold:#e8b93b;
    --red:#d9534f; --blue:#4a90d9; --purple:#9b59b6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px) 0 0/100% 4px,
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px) 0 0/4px 100%,
      var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px; line-height:1.6; padding:16px; min-height:100%;
  }
  .app{max-width:1400px;margin:0 auto;}
  header{border:2px solid var(--line);background:linear-gradient(180deg,#232a33,#1a1f26);padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.4);}
  h1{font-size:20px;letter-spacing:2px;color:var(--green);text-shadow:2px 2px 0 #000;white-space:nowrap;}
  h1 small{display:block;font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:400;}
  .res-bar{display:flex;flex-wrap:wrap;gap:8px;}
  .res{display:flex;align-items:center;gap:6px;background:#161a20;border:1px solid var(--line);padding:4px 10px;font-size:13px;min-width:78px;}
  .res .ico{font-size:15px;}
  .res .val{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}
  .res .val.warn{color:var(--red);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border:2px solid var(--line);background:var(--panel2);box-shadow:0 4px 0 rgba(0,0,0,.4);}
  .toolbar .spacer{flex:1;}
  .tag{font-size:11.5px;color:var(--dim);}
  .tag.crime-high{color:var(--red);}
  .tag.wage-warn{color:var(--red);}
  .tag.fire-ready{color:#e8a33b;font-weight:700;}
  .tag.payday{color:#8fd06a;font-weight:700;}
  main{display:grid;grid-template-columns:1fr 400px;gap:14px;margin-top:14px;align-items:start;}
  @media(max-width:1080px){ main{grid-template-columns:1fr;} }
  .panel{border:2px solid var(--line);background:var(--panel);box-shadow:0 4px 0 rgba(0,0,0,.4);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:2px solid var(--line);flex-wrap:wrap;}
  .panel-head h2{font-size:14px;letter-spacing:1px;color:var(--green);}
  .panel-body{padding:12px;}
  button{font-family:inherit;font-size:13px;cursor:pointer;background:#2f3843;color:var(--txt);border:2px solid #4a5563;border-bottom-color:#232a33;border-right-color:#232a33;padding:5px 12px;transition:.1s;}
  button:hover{background:#3b4757;}
  button:active{transform:translateY(1px);border-color:#232a33 #4a5563 #4a5563 #232a33;}
  button.primary{background:#3d6b2a;border-color:#5d9440 #234016 #234016 #5d9440;color:#eaf5e2;}
  button.primary:hover{background:#4b8334;}
  button.danger{background:#6b2a2a;border-color:#944040 #3d1616 #3d1616 #944040;color:#f5e2e2;}
  button.danger:hover{background:#833434;}
  button.fire{background:#8a4a1a;border-color:#b86a30 #4a2008 #4a2008 #b86a30;color:#ffe8d0;}
  button.fire:hover{background:#a05a22;}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  #advList{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
  .adv{background:#1a1f26;border:2px solid var(--line);padding:10px 12px;position:relative;}
  .adv.down{opacity:.55;border-color:#5a3030;}
  .adv.building-task{border-color:#7a5a20;}
  .adv.low-happy{border-color:#8a5a1a;}
  .adv.sick{border-color:#6a4a20;background:#241f14;}
  .adv.criminal{border-color:#8a2020;background:#261414;}
  .adv.imprisoned{border-color:#5a5a5a;background:#1f1f22;opacity:.75;}
  .adv.corrupt{border-color:#a06020;background:#261e10;}
  .adv.buff{box-shadow:0 0 0 2px rgba(232,185,59,.3);}
  .adv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .adv-name{font-size:15px;font-weight:700;color:#fff;}
  .adv-race{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:0 6px;}
  .adv-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:3px;}
  .badge{font-size:10.5px;padding:0 6px;border:1px solid;}
  .badge.prof{color:#e8b93b;border-color:#8a6f1a;background:#26220f;}
  .badge.happy-good{color:#8fd06a;border-color:#3d6b2a;background:#1c2419;}
  .badge.happy-mid{color:#e8b93b;border-color:#8a6f1a;background:#26220f;}
  .badge.happy-bad{color:#e2706a;border-color:#7a3030;background:#2b1919;}
  .badge.sick{color:#e8a33b;border-color:#8a5f1a;background:#2a1f0f;}
  .badge.criminal{color:#e2706a;border-color:#8a2020;background:#2b1414;}
  .badge.imprisoned{color:#a0a0a0;border-color:#5a5a5a;background:#1f1f22;}
  .badge.corrupt{color:#e8a33b;border-color:#8a5f1a;background:#2a1f0f;}
  .badge.rich{color:#e8b93b;border-color:#8a6f1a;background:#26220f;}
  .badge.warm{color:#e8a33b;border-color:#8a5a1a;background:#2a1f0f;}
  .adv-path{font-size:12px;color:var(--purple);margin:3px 0 6px;}
  .adv-path span{color:var(--dim);}
  .bars{display:flex;flex-direction:column;gap:3px;margin:6px 0;}
  .bar{position:relative;height:14px;background:#0e1116;border:1px solid var(--line);overflow:hidden;}
  .bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .3s;}
  .bar i.hp{background:linear-gradient(180deg,#c0392b,#8e2a20);}
  .bar i.mind{background:linear-gradient(180deg,#4a90d9,#2c5f96);}
  .bar i.happy{background:linear-gradient(180deg,#e8b93b,#a37c17);}
  .bar i.fatigue{background:linear-gradient(180deg,#9b59b6,#5d3275);}
  .bar b{position:absolute;inset:0;font-size:10px;font-weight:400;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000;letter-spacing:.5px;}
  .attrs{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0;}
  .attrs span{font-size:11px;background:#232a33;border:1px solid #333c47;padding:0 5px;color:#a9b4c2;}
  .attrs span em{font-style:normal;color:var(--gold);font-weight:700;}
  .wallet{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#161a20;border:1px solid var(--line);padding:4px 8px;font-size:12px;margin:5px 0;}
  .wallet .coin{color:var(--gold);font-weight:700;}
  .wallet .inv{color:var(--dim);font-size:11.5px;}
  .task-row{display:flex;gap:6px;margin-top:8px;}
  .task-row select{flex:1;font-family:inherit;font-size:12px;background:#232a33;color:var(--txt);border:1px solid var(--line);padding:4px 6px;outline:none;}
  .task-row button{padding:4px 8px;font-size:12px;}
  .empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:13px;}
  #logList{max-height:500px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px;background:#1a1f26;border:2px solid var(--line);}
  #logList::-webkit-scrollbar{width:8px;}
  #logList::-webkit-scrollbar-track{background:#141a20;}
  #logList::-webkit-scrollbar-thumb{background:#39414d;}
  .log-item{font-size:12.5px;line-height:1.5;border-left:3px solid var(--line);padding:3px 8px;background:#20262e;color:#b8c2ce;}
  .log-item.good{border-left-color:var(--green);color:#bcd9a8;}
  .log-item.bad{border-left-color:var(--red);color:#e2b0ae;}
  .log-item.epic{border-left-color:var(--gold);color:#eddcae;}
  .log-item.warn{border-left-color:#e8a33b;color:#e8cba0;}
  .log-item.day{background:#2b3240;border-left-color:var(--blue);color:#a9c8ea;font-weight:700;}
  .log-item .d{color:var(--dim);margin-right:5px;font-size:11px;}
  #campsitePanel{margin-top:14px;}
  .camp-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px;}
  .camp-overview > div{background:#161a20;border:2px solid var(--line);padding:6px 10px;}
  .camp-overview span{display:block;font-size:11px;color:var(--dim);}
  .camp-overview b{font-size:15px;color:var(--gold);}
  .camp-overview .danger b{color:var(--red);}
  .camp-overview .good b{color:var(--green);}
  .project-bar{background:#161a20;border:2px solid var(--line);padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .project-bar.none{color:var(--dim);}
  .prog{flex:1;min-width:160px;height:16px;background:#0e1116;border:1px solid var(--line);position:relative;overflow:hidden;}
  .prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#e8b93b,#9c7a17);transition:width .4s;}
  .prog b{position:absolute;inset:0;font-size:11px;font-weight:400;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000;}
  #buildingGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
  .bld{background:#1a1f26;border:2px solid var(--line);padding:10px;cursor:pointer;transition:.12s;position:relative;display:flex;flex-direction:column;gap:4px;}
  .bld:hover{border-color:#5a6675;transform:translateY(-1px);}
  .bld.built{border-color:#3d6b2a;background:#1c2419;}
  .bld.building{border-color:#e8b93b;background:#26220f;}
  .bld.ready{border-color:#4a90d9;}
  .bld.locked{opacity:.55;}
  .bld.maxed{border-color:#e8b93b;background:#26220f;}
  .bld-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .bld-icon{font-size:22px;line-height:1;}
  .bld-name{font-size:14px;font-weight:700;color:#fff;flex:1;}
  .bld-lv{font-size:11px;color:#a9b4c2;background:#232a33;border:1px solid var(--line);padding:0 6px;white-space:nowrap;}
  .bld-lv.max{color:#e8b93b;border-color:#8a6f1a;}
  .bld-desc{font-size:11.5px;color:#9aa5b3;line-height:1.45;min-height:44px;}
  .bld-cost{font-size:11.5px;color:var(--dim);border-top:1px dashed #333c47;padding-top:5px;line-height:1.6;}
  .bld-cost em{font-style:normal;color:var(--gold);}
  .bld-cost .miss{color:var(--red);}
  .bld-cost .ok{color:var(--gold);}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .mask.on{display:flex;}
  .modal{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:var(--panel);border:2px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.5);}
  .modal.wide{max-width:960px;}
  .modal-head{padding:12px 16px;background:var(--panel2);border-bottom:2px solid var(--line);font-size:15px;color:var(--green);letter-spacing:1px;font-weight:700;}
  .modal-body{padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:13px;background:#161a20;color:var(--txt);border:2px solid var(--line);padding:6px 9px;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--green);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .desc{font-size:12px;color:var(--dim);min-height:34px;margin-top:4px;line-height:1.5;}
  .attr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
  .attr-grid .cell{background:#161a20;border:2px solid var(--line);padding:6px;}
  .attr-grid .cell label{display:block;font-size:11px;color:var(--dim);text-align:center;}
  .attr-grid .cell input{width:100%;text-align:center;font-size:16px;font-weight:700;background:transparent;border:none;color:var(--gold);outline:none;font-family:inherit;}
  .attr-grid .cell .mod{text-align:center;font-size:11px;height:14px;}
  .mod.up{color:var(--green);}
  .mod.down{color:var(--red);}
  .preview{background:#161a20;border:2px dashed var(--line);padding:10px;font-size:12.5px;color:#a9b4c2;margin-top:6px;}
  .preview b{color:var(--gold);}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--panel2);border-top:2px solid var(--line);}
  .hint{font-size:11.5px;color:var(--dim);margin-top:6px;}
  .stat-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
  .stat-summary > div{background:#161a20;border:2px solid var(--line);padding:8px 10px;}
  .stat-summary span{display:block;font-size:11px;color:var(--dim);}
  .stat-summary b{font-size:16px;color:var(--gold);}
  .stat-card{background:#1a1f26;border:2px solid var(--line);padding:12px;margin-bottom:12px;}
  .stat-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;}
  .stat-name span{font-size:11.5px;font-weight:400;color:var(--purple);margin-left:6px;}
  .stat-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .stat-table th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;padding:3px 6px;border-bottom:1px solid var(--line);letter-spacing:.5px;}
  .stat-table td{padding:3px 6px;border-bottom:1px solid #262d36;}
  .stat-table td b{color:var(--gold);}
  .stat-table .up{color:var(--green);font-weight:700;}
  .stat-table .down{color:var(--red);font-weight:700;}
  .stat-foot{margin-top:8px;padding-top:8px;border-top:1px dashed #333c47;display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#9aa5b3;}
  .stat-foot b{color:var(--gold);}
  .wage-panel{background:#161a20;border:2px solid var(--line);padding:10px 12px;margin-bottom:12px;}
  .wage-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;}
  .wage-row label{color:var(--dim);}
  .wage-row input[type=range]{flex:1;min-width:120px;accent-color:#e8b93b;}
  .wage-row b{color:var(--gold);}
  .joy-panel{background:#161a20;border:2px solid #5a3a1a;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .joy-panel .info{flex:1;min-width:200px;font-size:12.5px;color:#c9b58a;line-height:1.5;}
  .joy-panel .info b{color:#e8b93b;}
  footer{text-align:center;color:#4d5663;font-size:11.5px;margin:18px 0 6px;}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>MC冒险者模拟器<small>Minecraft: Arcane Age —— 据点经营者</small></h1>
    <div class="res-bar" id="resBar"></div>
  </header>

  <div class="toolbar">
    <button id="btnRecruit" class="primary">＋ 招募冒险者（30金币）</button>
    <span class="spacer"></span>
    <span class="tag" id="popTag"></span>
    <span class="tag" id="wageTag"></span>
    <span class="tag" id="crimeTag"></span>
    <span class="tag" id="joyTag"></span>
    <button id="btnStats">📊 冒险者统计</button>
    <button id="btnExport">⬇ 导出存档</button>
    <button id="btnImport">⬆ 导入存档</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
    <button id="btnReset" class="danger">重置存档</button>
  </div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>⚔ 冒险者名册</h2>
        <span class="hint" id="advSummary"></span>
      </div>
      <div class="panel-body">
        <div id="advList"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>📜 据点日志</h2>
      </div>
      <div class="panel-body" style="padding:0;">
        <div id="logList"></div>
        <div style="padding:10px;border-top:2px solid var(--line);background:var(--panel2);">
          <button class="primary" id="btnNext" style="width:100%;padding:9px;font-size:14px;letter-spacing:2px;">
            ☀ 结算一天
          </button>
          <div class="hint">分配任务 → 结算一天。月薪每 30 天发放一次。每月休息 8 日即可抵消 22 日劳作损耗。</div>
        </div>
      </div>
    </section>
  </main>

  <section class="panel" id="campsitePanel">
    <div class="panel-head">
      <h2>🏕 营地建设</h2>
      <span class="hint">点击建筑卡片开工或升级，再派冒险者执行「建造」任务推进工时</span>
    </div>
    <div class="panel-body">
      <div class="joy-panel">
        <span style="font-size:22px;">🔥</span>
        <div class="info" id="joyInfo"></div>
        <button class="fire" id="btnFeast">🎊 举办篝火晚会</button>
      </div>

      <div class="wage-panel">
        <div class="wage-row">
          <label>💰 月薪等级：</label>
          <input type="range" id="wageSlider" min="0" max="3" step="1" value="1">
          <b id="wageLabel">标准</b>
          <span id="wageDetail" style="color:var(--dim);"></span>
        </div>
        <div class="hint">工资每 30 天发放一次。工资越高，幸福度与诚信越稳定，但金币消耗也越多。</div>
      </div>

      <div class="camp-overview" id="campOverview"></div>
      <div id="projectBar"></div>
      <div id="buildingGrid"></div>
    </div>
  </section>

  <footer>基于《我的世界：奥术时代 TRPG》规则书设定的经营模拟 · 数据保存在本地浏览器</footer>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head" id="modalTitle">招募冒险者</div>
    <div class="modal-body">
      <div class="row2">
        <div class="field">
          <label>姓名</label>
          <input id="f-name" type="text" placeholder="输入姓名" maxlength="12">
        </div>
        <div class="field">
          <label>奥术道路</label>
          <select id="f-path"></select>
        </div>
      </div>

      <div class="field">
        <label>种族</label>
        <select id="f-race"></select>
        <div class="desc" id="raceDesc"></div>
      </div>

      <div class="field">
        <label>基础属性（1D6×3 或 1D6×2+6，单项不超过 18）</label>
        <div class="attr-grid" id="attrGrid"></div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button id="btnRoll">🎲 重新掷骰</button>
          <button id="btnPointBuy">📐 购点制（96点）</button>
        </div>
      </div>

      <div class="preview" id="preview"></div>
    </div>
    <div class="modal-foot">
      <button class="danger" id="btnCancel">取消</button>
      <button class="primary" id="btnSave">确认</button>
    </div>
  </div>
</div>

<div class="mask" id="statsMask">
  <div class="modal wide">
    <div class="modal-head">📊 冒险者数值统计</div>
    <div class="modal-body" id="statsBody"></div>
    <div class="modal-foot">
      <span class="hint">「初始」为招募时的基础属性，「当前」含劳作成长，不含种族修正。</span>
      <button class="primary" id="btnStatsClose">关闭</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const d = n => Math.floor(Math.random() * n) + 1;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const safe = (v, fallback = 0) => (typeof v === 'number' && !isNaN(v) && isFinite(v)) ? v : fallback;

const ATTR_KEYS = ['力量', '体质', '敏捷', '意志', '魅力', '灵感', '幸运', '智力'];
const ATTR_ICON = {
  力量: '💪', 体质: '❤', 敏捷: '🏃', 意志: '🧠',
  魅力: '✨', 灵感: '👁', 幸运: '🍀', 智力: '📖'
};

const WAGE_PERIOD = 30;

/* =========================================================
   种族
   ========================================================= */

/* =========================================================
   属性计算
   ========================================================= */
function rollBaseAttrs() {
  const a = {};
  ['力量', '敏捷', '意志', '魅力', '灵感'].forEach(k => a[k] = d(6) * 3);
  ['体质', '幸运', '智力'].forEach(k => a[k] = d(6) * 2 + 6);
  return a;
}

function getAttrs(adv) {
  const mod = (RACES[adv.race] || { mod: {} }).mod;
  const out = {};
  ATTR_KEYS.forEach(k => out[k] = clamp((adv.baseAttrs[k] || 10) + (mod[k] || 0), 1, 30));

  (adv.diseases || []).forEach(dz => {
    for (const [k, v] of Object.entries(dz.effect || {})) {
      if (k === '全属性') {
        ATTR_KEYS.forEach(ak => out[ak] = clamp(out[ak] + v, 1, 30));
      } else if (out[k] !== undefined) {
        out[k] = clamp(out[k] + v, 1, 30);
      }
    }
  });
  return out;
}

function calcMax(adv) {
  const a = getAttrs(adv);
  return { hp: a.体质 * 2, mind: a.意志 * 2 };
}

function diseaseWorkMul(adv) {
  if (!adv.diseases || !adv.diseases.length) return 1;
  return Math.min(...adv.diseases.map(dz => dz.workMul));
}

/* =========================================================
   检定
   ========================================================= */
function grade(total, roll) {
  if (roll === 1) return { k: 'F', n: '大失败', m: 0 };
  if (roll === 20) return { k: 'S', n: '大成功', m: 2.4 };
  if (total >= 32) return { k: 'A', n: '极佳', m: 1.9 };
  if (total >= 26) return { k: 'B', n: '优异', m: 1.55 };
  if (total >= 19) return { k: 'C', n: '成功', m: 1.2 };
  if (total >= 14) return { k: 'D', n: '勉强', m: 0.75 };
  return { k: 'E', n: '失败', m: 0.35 };
}

    const e = b.effect(lv);
    for (const [k, v] of Object.entries(e)) {
      if (k.endsWith('倍率') || k === '巡逻加成' || k === '痊愈加成' || k === '行医加成' || k === '行医节流' || k === '传染压制' || k === '娱乐加成' || k === '休息倍率' || k === '患病压制') {
        E[k] = (E[k] ?? 1) * v;
      } else if (k === '铁等级') E[k] = Math.max(E[k] ?? 0, v);
      else E[k] = (E[k] ?? 0) + v;
    }
  }
  E.夜袭倍率 = clamp(safe(E.夜袭倍率, 1), 0.15, 1);
  E.受伤倍率 = clamp(safe(E.受伤倍率, 1), 0.3, 1);
  E.传染压制 = clamp(safe(E.传染压制, 1), 0.1, 1);
  E.患病压制 = clamp(safe(E.患病压制, 1), 0.2, 1);
  E.休息倍率 = Math.max(0.5, safe(E.休息倍率, 1));
  E.产量倍率 = Math.max(0.1, safe(E.产量倍率, 1));
  E.娱乐加成 = Math.max(0.1, safe(E.娱乐加成, 1));
  return E;
}

function happinessMul(h) {
  return 0.4 + (safe(h, 60) / 100) * 1.0;
}

/* =========================================================
   月薪
   ========================================================= */
function baseMonthlyWage(adv) {
  const p = PATHS[adv.path] || { wage: 0 };
  return 8 + (p.wage || 0) * 2;
}
function monthlyWage(adv) {
  const tier = WAGE_TIERS[state.wageTier] || WAGE_TIERS[2];
  return Math.round(baseMonthlyWage(adv) * tier.mul * 10) / 10;
}
function totalMonthlyWage() {
  return state.adventurers.reduce((s, a) => s + monthlyWage(a), 0);
}
function daysToPayday() {
  return (WAGE_PERIOD - (state.day % WAGE_PERIOD)) % WAGE_PERIOD;
}

/* =========================================================
   篝火晚会
   ========================================================= */
const FEAST_COST = { 食物: 15, 金币: 20 };

function canFeast() {
  if (state.adventurers.length === 0) return { ok: false, reason: '据点空无一人' };
  if (state.feast.cooldown > 0) return { ok: false, reason: `冷却中（还需 ${state.feast.cooldown} 天）` };
  for (const [r, v] of Object.entries(FEAST_COST)) {
    if ((state.res[r] || 0) < v) return { ok: false, reason: `${r} 不足（需 ${v}）` };
  }
  return { ok: true };
}

function holdFeast() {
  const check = canFeast();
  if (!check.ok) { alert('无法举办篝火晚会：' + check.reason); return; }
  if (!confirm(`举办篝火晚会将消耗：\n食物 ${FEAST_COST.食物}、金币 ${FEAST_COST.金币}\n\n全员幸福度将大幅提升，并持续数天。确定吗？`)) return;

  for (const [r, v] of Object.entries(FEAST_COST)) state.res[r] -= v;
  state.totals.feasts = (state.totals.feasts || 0) + 1;

  const baseHappy = rnd(15, 25);
  state.adventurers.forEach(adv => {
    if (adv.status === '昏迷') return;
    adv.happiness = clamp(adv.happiness + baseHappy, 0, 100);
    adv.mind = Math.min(calcMax(adv).mind, adv.mind + rnd(3, 8));
    adv.fatigue = clamp(adv.fatigue - 20, 0, 100);
    adv.stats.feastHappy += baseHappy;
  });

  state.feast.bonusDays = 3;
  state.feast.cooldown = 5;
  state.feast.lastDay = state.day;

  addLog(`🎊 据点举办了盛大的篝火晚会！全员幸福 +${baseHappy}，持续 3 天额外加成。`, 'epic');
  render(); save();
}

/* =========================================================
   个人消费
   ========================================================= */
function tryPersonalSpending(adv, lines) {
  if (adv.status === '昏迷' || adv.imprisoned > 0) return;
  if (adv.happiness >= 80) return;
  if (adv.wallet < 2) return;

  const desire = (80 - adv.happiness) / 80;
  if (Math.random() > desire * 0.15) return;

  const affordable = SPENDING_OPTIONS.filter(o => o.cost <= adv.wallet);
  if (!affordable.length) return;
  const choice = pick(affordable);

  adv.wallet = Math.round((adv.wallet - choice.cost) * 10) / 10;
  adv.stats.spent = Math.round((adv.stats.spent || 0) + choice.cost, 1);

  let happy = choice.happy;
  let desc = choice.desc;

  if (choice.risk) {
    if (Math.random() < 0.4) {
      happy = -Math.max(2, Math.round(choice.happy / 2));
      desc = '赌输了，心情反而变糟';
    } else if (Math.random() < 0.15) {
      const win = rnd(5, 15);
      adv.wallet = Math.round((adv.wallet + win) * 10) / 10;
      happy = choice.happy + 5;
      desc = `手气不错，赢回 ${win} 金币`;
    }
  }

  if (choice.item && adv.inventory.length < 15) {
    const item = pick(PERSONAL_ITEMS);
    if (!adv.inventory.includes(item)) {
      adv.inventory.push(item);
      desc += `（获得「${item}」）`;
    }
  }

  if (choice.teamHappy) {
    state.adventurers.forEach(t => {
      if (t.id === adv.id) return;
      if (t.status === '昏迷' || t.imprisoned > 0) return;
      t.happiness = clamp(t.happiness + choice.teamHappy, 0, 100);
      t.stats.feastHappy += choice.teamHappy;
    });
  }

  adv.happiness = clamp(adv.happiness + happy, 0, 100);
  if (happy > 0) adv.stats.feastHappy += happy;

  if (happy > 0) {
    lines.push(`🛍 <b>${adv.name}</b> ${choice.name}（花费 ${choice.cost} 金币），幸福 +${happy}。`);
  } else {
    lines.push(`🛍 <b>${adv.name}</b> ${choice.name}（花费 ${choice.cost} 金币），${desc}。`);
  }
}

/* =========================================================
   建筑费用 / 工时
   ========================================================= */
function buildingCost(key, targetLevel) {
  const b = BUILDINGS[key];
  const p = Math.pow(b.costMul, targetLevel - 1);
  const out = {};
  for (const [r, v] of Object.entries(b.baseCost)) out[r] = Math.round(v * p);
  return out;
}
function buildingWork(key, targetLevel) {
  const b = BUILDINGS[key];
  return Math.round(b.baseWork * Math.pow(b.workMul, targetLevel - 1));
}

        </div>
        <div class="bld-desc">${descTxt}</div>
        <div class="bld-cost">${actionTxt}</div>
      </div>

  }).join('');

  grid.querySelectorAll('.bld').forEach(el => {

  if (lv >= 5) { alert(`${k} 已经达到满级。`); return; }
  if (state.project) {
    alert(`当前已有工程在施工中：${state.project.key} → Lv.${state.project.targetLevel}\n请先完成或放弃该工程。`);
    return;
  }
  const targetLv = lv + 1;
  const cost = buildingCost(k, targetLv);
  const missing = Object.entries(cost).filter(([r, v]) => (state.res[r] || 0) < v);
  if (missing.length) {
    alert('资源不足：\n' + missing.map(([r, v]) => `${r} 需要 ${v}，当前 ${state.res[r] || 0}`).join('\n'));
    return;
  }
  Object.entries(cost).forEach(([r, v]) => { state.res[r] -= v; });
  state.project = {
    key: k,
    targetLevel: targetLv,
    progress: 0,
    required: buildingWork(k, targetLv)
  };
  const verb = lv > 0 ? '升级' : '建造';
  addLog(`🔨 开始${verb} <b>${k}</b> → Lv.${targetLv}，需要 ${state.project.required} 点工时。`, 'epic');
  render(); save();
}

function cancelProject() {
  if (!state.project) return;
  const pj = state.project;
  if (!confirm(`确定放弃「${pj.key} → Lv.${pj.targetLevel}」的工程吗？\n已投入的工时将全部浪费，材料不退还。`)) return;
  addLog(`🚫 放弃了「${pj.key} → Lv.${pj.targetLevel}」的工程，材料与工时付诸东流。`, 'bad');
  state.project = null;
  render(); save();
}

/* =========================================================
   渲染总入口
   ========================================================= */
function render() {
  renderRes();
  renderAdvs();
  renderLog();
  renderCampsite();
  renderWagePanel();
}

/* =========================================================
   弹窗 —— 招募 / 编辑
   ========================================================= */
function initModalSelects() {
  $('#f-race').innerHTML = Object.keys(RACES).map(r => `<option value="${r}">${r}</option>`).join('');
  $('#f-path').innerHTML = Object.keys(PATHS).map(p => `<option value="${p}">${p}</option>`).join('');

  $('#attrGrid').innerHTML = ATTR_KEYS.map(k => `
    <div class="cell">
      <label>${ATTR_ICON[k]} ${k}</label>
      <input type="number" min="1" max="18" data-attr="${k}" value="10">
      <div class="mod" data-mod="${k}"></div>
    </div>
  `).join('');

  $('#attrGrid').querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', updatePreview);
  });
  $('#f-race').addEventListener('change', updatePreview);
  $('#f-path').addEventListener('change', updatePreview);
}

function readBaseFromInputs() {
  const o = {};
  ATTR_KEYS.forEach(k => {
    const inp = $(`#attrGrid input[data-attr="${k}"]`);
    o[k] = clamp(parseInt(inp.value) || 10, 1, 18);
  });
  return o;
}

function writeBaseToInputs(obj) {
  ATTR_KEYS.forEach(k => {
    $(`#attrGrid input[data-attr="${k}"]`).value = obj[k];
  });
}

function updatePreview() {
  const base = readBaseFromInputs();
  const race = $('#f-race').value;
  const mod = (RACES[race] || { mod: {} }).mod;

  ATTR_KEYS.forEach(k => {
    const el = $(`#attrGrid .mod[data-mod="${k}"]`);
    const mv = mod[k] || 0;
    el.textContent = mv ? (mv > 0 ? '+' + mv : mv) : '';
    el.className = 'mod ' + (mv > 0 ? 'up' : mv < 0 ? 'down' : '');
  });

  const fin = {};
  ATTR_KEYS.forEach(k => fin[k] = clamp(base[k] + (mod[k] || 0), 1, 30));

  const path = $('#f-path').value;
  const pb = PATHS[path] ? PATHS[path].bonus : {};
  const bonusTxt = Object.keys(pb).length
    ? Object.entries(pb).map(([k, v]) => `${k}+${v}`).join('、')
    : '无';

  const pathWage = PATHS[path] ? PATHS[path].wage : 0;
  const baseMonthly = 8 + pathWage * 2;
  const tier = WAGE_TIERS[state.wageTier];

  $('#preview').innerHTML = `
    <div>最终属性：${ATTR_KEYS.map(k => `${k} <b>${fin[k]}</b>`).join(' · ')}</div>
    <div style="margin-top:5px;">
      生命 <b>${fin.体质 * 2}</b> ·
      先攻 <b>${fin.敏捷}</b> ·
      心理状态 <b>${fin.意志 * 2}</b> ·
      个人伤害 <b>${fin.力量 <= 6 ? '1D3' : fin.力量 <= 12 ? '1D6' : fin.力量 <= 18 ? '2D6' : '3D6'}</b>
    </div>
    <div style="margin-top:5px;color:#8892a0;">道路加成：${bonusTxt}</div>
    <div style="margin-top:5px;color:#e8b93b;">月薪预估：约 ${(baseMonthly * tier.mul).toFixed(1)} 金币（${tier.name}档）</div>
  `;
  $('#raceDesc').textContent = RACES[race] ? RACES[race].desc : '';
  $('#f-path').title = PATHS[path] ? PATHS[path].desc : '';
}

function openModal(id) {
  editingId = id || null;
  const adv = id ? state.adventurers.find(a => a.id === id) : null;

  $('#modalTitle').textContent = adv ? `编辑 —— ${adv.name}` : '招募冒险者';
  $('#btnSave').textContent = adv ? '保存修改' : '确认招募';

  if (adv) {
    $('#f-name').value = adv.name;
    $('#f-race').value = adv.race;
    $('#f-path').value = adv.path;
    writeBaseToInputs(adv.baseAttrs);
  } else {
    $('#f-name').value = genName();
    $('#f-race').value = pick(Object.keys(RACES));
    $('#f-path').value = pick(Object.keys(PATHS));
    writeBaseToInputs(rollBaseAttrs());
  }
  updatePreview();
  $('#mask').classList.add('on');
}

function closeModal() {
  $('#mask').classList.remove('on');
  editingId = null;
}

/* =========================================================
   增删改
   ========================================================= */
function recruit() {
  const cost = 30;
  if (state.res.金币 < cost) {
    addLog('❌ 金币不足，无法招募新的冒险者。', 'bad');
    renderLog(); save();
    return;
  }
  state.res.金币 -= cost;
  openModal(null);
}

function saveAdv() {
  const name = ($('#f-name').value || '').trim() || genName();
  const race = $('#f-race').value;
  const path = $('#f-path').value;
  const base = readBaseFromInputs();

  if (editingId) {
    const adv = state.adventurers.find(a => a.id === editingId);
    if (!adv) return closeModal();
    const oldMax = calcMax(adv);
    adv.name = name; adv.race = race; adv.path = path; adv.baseAttrs = base;
    const newMax = calcMax(adv);
    adv.hp = clamp(Math.round(safe(adv.hp, oldMax.hp) / oldMax.hp * newMax.hp), 1, newMax.hp);
    adv.mind = clamp(Math.round(safe(adv.mind, oldMax.mind) / oldMax.mind * newMax.mind), 0, newMax.mind);
    addLog(`📝 ${name} 的角色卡已被更新。`, '');
  } else {
    const adv = newAdventurer(name, race, path, base);
    if (Math.random() < 0.7) adv.inventory.push(pick(PERSONAL_ITEMS));
    state.adventurers.push(adv);
    addLog(`🎉 新冒险者 <b>${name}</b>（${race} · ${path}）加入了据点！`, 'good');
  }
  closeModal();
  render(); save();
}

function removeAdv(id) {
  const adv = state.adventurers.find(a => a.id === id);
  if (!adv) return;
  if (!confirm(`确定要解雇 ${adv.name} 吗？此操作不可撤销。\n他将带走个人财产 ${adv.wallet.toFixed(1)} 金币。`)) return;
  state.adventurers = state.adventurers.filter(a => a.id !== id);
  addLog(`🚪 ${adv.name} 收拾行囊（带着 ${adv.wallet.toFixed(1)} 金币），离开了据点。`, 'bad');
  render(); save();
}

/* =========================================================
   核心：结算一天
   ========================================================= */
function nextDay() {
  const lines = [];
  const gain = { 食物: 0, 木材: 0, 石头: 0, 铁: 0, 金币: 0, 绿宝石: 0 };
  const E = campEffects();
  const pop = state.adventurers.length;

  // 数据修复
  state.adventurers.forEach(adv => {
    const m = calcMax(adv);
    if (typeof adv.hp !== 'number' || isNaN(adv.hp)) adv.hp = adv.status === '昏迷' ? 0 : m.hp;
    if (typeof adv.mind !== 'number' || isNaN(adv.mind)) adv.mind = adv.status === '昏迷' ? 0 : m.mind;
    if (typeof adv.happiness !== 'number' || isNaN(adv.happiness)) adv.happiness = 60;
    if (typeof adv.fatigue !== 'number' || isNaN(adv.fatigue)) adv.fatigue = 0;
    if (typeof adv.wallet !== 'number' || isNaN(adv.wallet)) adv.wallet = 0;
    if (typeof adv.integrity !== 'number' || isNaN(adv.integrity)) adv.integrity = 60;
    if (typeof adv.consecutiveWork !== 'number' || isNaN(adv.consecutiveWork)) adv.consecutiveWork = 0;
    if (typeof adv.stats.spent !== 'number') adv.stats.spent = 0;
    if (typeof adv.stats.feastHappy !== 'number') adv.stats.feastHappy = 0;
  });

  // 篝火晚会倒计时
  if (state.feast.cooldown > 0) state.feast.cooldown--;
  if (state.feast.bonusDays > 0) state.feast.bonusDays--;

  // 监禁倒计时
  state.adventurers.forEach(adv => {
    if (adv.imprisoned > 0) {
      adv.imprisoned--;
      if (adv.imprisoned === 0) lines.push(`🔓 <b>${adv.name}</b> 刑满释放。`);
    }
  });

  /* ---------- 1. 冒险者行动 ---------- */
  state.adventurers.forEach(adv => {
    const a = getAttrs(adv);
    const max = calcMax(adv);

    if (adv.imprisoned > 0) {
      lines.push(`🔒 <b>${adv.name}</b> 仍在监禁中（剩 ${adv.imprisoned} 天）。`);
      return;
    }

    if (adv.status === '昏迷') {
      if (Math.random() < 0.35) {
        adv.status = '正常';
        adv.hp = Math.max(1, Math.round(max.hp * 0.3));
        adv.task = '休息';
        lines.push(`💫 <b>${adv.name}</b> 从昏迷中苏醒过来，但仍十分虚弱。`);
      } else {
        lines.push(`🩸 <b>${adv.name}</b> 依旧昏迷不醒。`);
      }
      return;
    }

    const task = TASKS[adv.task] || TASKS['休息'];
    const eff = happinessMul(adv.happiness) * diseaseWorkMul(adv);

    /* ---- 建造（疲劳 +8） ---- */
    if (adv.task === '建造') {
      if (!state.project) {
        lines.push(`🔨 <b>${adv.name}</b> 环顾四周，暂无工程可做，闲了一天。`);
        adv.consecutiveWork++;
        adv.fatigue = clamp(adv.fatigue + 4, 0, 100);
        return;
      }
      const contrib = Math.max(1, Math.round((1 + Math.floor(a.力量 / 6)) * eff));
      const pj = state.project;
      pj.progress += contrib;
      adv.stats.worked++;
      adv.workDays++;
      adv.consecutiveWork++;
      adv.fatigue = clamp(adv.fatigue + 8, 0, 100);
      state.totals.worked++;

      maybeCorrupt(adv, '建造', lines);

      if (pj.progress >= pj.required) {
        const newLv = pj.targetLevel;
        state.buildings[pj.key] = newLv;
        const verb = newLv > 1 ? '升级完成' : '建造完成';
        lines.push(`🎉 <b>${pj.key}</b> ${verb}（Lv.${newLv}）！${BUILDINGS[pj.key].desc(newLv)}`);
        state.project = null;
      } else {
        lines.push(`🔨 <b>${adv.name}</b> 投入建造，进度 +${contrib}（${pj.progress}/${pj.required}）`);
      }
      return;
    }

    /* ---- 巡逻（疲劳 +5） ---- */
    if (adv.task === '巡逻') {
      const roll = d(20);
      const total = roll + (a.意志 || 10) + (a.灵感 || 10) / 2 + E.检定加值;
      const g = grade(total, roll);
      adv.stats.worked++;
      adv.workDays++;
      adv.consecutiveWork++;
      adv.fatigue = clamp(adv.fatigue + 5, 0, 100);
      state.totals.worked++;

      const pressure = (g.m * 6 + 3) * E.巡逻加成;
      state.crime.level = clamp(state.crime.level - pressure, 0, 100);

      if (g.k === 'F') {
        const dmg = rnd(1, 4);
        adv.hp = Math.max(0, adv.hp - dmg);
        adv.stats.injured += dmg;
        state.totals.injured += dmg;
        lines.push(`🛡 <b>${adv.name}</b> 巡逻时遭遇冲突，受伤 ${dmg} 点。`);
        if (adv.hp <= 0) { adv.status = '昏迷'; adv.task = '休息'; adv.stats.downed++; }
      } else if (g.m >= 1.5) {
        lines.push(`🛡 <b>${adv.name}</b> 巡逻【${g.n}】，治安大幅改善（犯罪率 -${Math.round(pressure)}）。`);
      } else {
        lines.push(`🛡 <b>${adv.name}</b> 巡逻【${g.n}】，治安略有改善（犯罪率 -${Math.round(pressure)}）。`);
      }
      return;
    }

    /* ---- 娱乐（疲劳 +4） ---- */
    if (adv.task === '娱乐') {
      const roll = d(20);
      const total = roll + (a.魅力 || 10) * 1.2 + (a.灵感 || 10) / 2 + E.检定加值;
      const g = grade(total, roll);
      adv.stats.worked++;
      adv.stats.entertaining++;
      adv.workDays++;
      adv.consecutiveWork++;
      adv.fatigue = clamp(adv.fatigue + 4, 0, 100);
      state.totals.worked++;

      const baseUp = Math.round((2 + a.魅力 / 5) * g.m * E.娱乐加成);
      state.adventurers.forEach(t => {
        if (t.status === '昏迷' || t.imprisoned > 0) return;
        t.happiness = clamp(t.happiness + baseUp, 0, 100);
        t.stats.feastHappy += baseUp;
      });
      adv.mind = Math.min(max.mind, adv.mind + Math.round(baseUp / 2));

      if (g.k === 'F') {
        adv.happiness = clamp(adv.happiness - 3, 0, 100);
        lines.push(`🎭 <b>${adv.name}</b> 的表演反响平平，全队心情略受影响。`);
      } else if (g.m >= 1.9) {
        lines.push(`🎭 <b>${adv.name}</b> 的表演【${g.n}】赢得满堂彩！全队幸福 +${baseUp}。`);
      } else {
        lines.push(`🎭 <b>${adv.name}</b> 表演【${g.n}】，全队幸福 +${baseUp}。`);
      }
      return;
    }

    /* ---- 行医（疲劳 +4） ---- */
    if (adv.task === '行医') {
      if (adv.path !== '炼金术士') {
        lines.push(`⚕ <b>${adv.name}</b> 并非炼金术士，无法行医。`);
        return;
      }
      const patients = state.adventurers.filter(x => x.id !== adv.id && (x.diseases || []).length > 0);
      if (!patients.length) {
        lines.push(`⚕ <b>${adv.name}</b> 巡视一圈，无人需要治疗。`);
        return;
      }
      const roll = d(20);
      const total = roll + (a.智力 || 10) + (a.灵感 || 10) / 2 + E.检定加值;
      const g = grade(total, roll);
      adv.stats.worked++;
      adv.workDays++;
      adv.consecutiveWork++;
      adv.fatigue = clamp(adv.fatigue + 4, 0, 100);
      state.totals.worked++;

      patients.sort((x, y) => {
        const sx = Math.max(...x.diseases.map(z => z.severity));
        const sy = Math.max(...y.diseases.map(z => z.severity));
        return sy - sx;
      });
      const patient = patients[0];
      const dz = patient.diseases[0];
      const baseCure = DISEASES[dz.name] ? DISEASES[dz.name].alchemyCure : 0.5;
      const cureChance = baseCure * g.m * E.行医加成;

      const cost = { 食物: Math.max(1, Math.round(2 * E.行医节流)) };
      if (dz.severity >= 3) cost.绿宝石 = 1;
      let affordable = true;
      for (const [r, v] of Object.entries(cost)) {
        if (v > 0 && (state.res[r] || 0) < v) { affordable = false; break; }
      }
      if (!affordable) {
        lines.push(`⚕ <b>${adv.name}</b> 想为 <b>${patient.name}</b> 治疗，却缺少药物。`);
        return;
      }
      for (const [r, v] of Object.entries(cost)) {
        if (v > 0) state.res[r] -= v;
      }

      if (Math.random() < cureChance) {
        patient.diseases = patient.diseases.filter(x => x !== dz);
        adv.stats.cured++;
        lines.push(`⚕ <b>${adv.name}</b> 以炼金术治愈了 <b>${patient.name}</b> 的${dz.name}！`);
      } else {
        dz.days = Math.max(1, dz.days - 2);
        lines.push(`⚕ <b>${adv.name}</b> 为 <b>${patient.name}</b> 缓解了${dz.name}（剩 ${dz.days} 天）。`);
      }
      return;
    }

    /* ---- 休息（大幅恢复） ---- */
    if (adv.task === '休息') {
      const restMul = Math.max(0.5, safe(E.休息倍率, 1));
      const heal = Math.max(3, Math.round(max.hp * 0.40 * restMul));
      const mheal = Math.max(3, Math.round(max.mind * 0.50 * restMul)) + safe(E.心理恢复, 0);
      const before = adv.hp;
      adv.hp = Math.min(max.hp, adv.hp + heal);
      adv.mind = Math.min(max.mind, adv.mind + mheal);
      adv.stats.healed = (adv.stats.healed || 0) + (adv.hp - before);
      adv.consecutiveWork = 0;
      adv.fatigue = clamp(adv.fatigue - 65, 0, 100);
      // 休息恢复幸福：8 + 住房等级×2
      const restHappy = 8 + Math.round((state.buildings['住房'] || 0) * 2);
      adv.happiness = clamp(adv.happiness + restHappy, 0, 100);
      adv.stats.feastHappy += restHappy;
      lines.push(`🛏 <b>${adv.name}</b> 休息了一天，生命 +${adv.hp - before}，心理 +${mheal}，幸福 +${restHappy}。`);
      return;
    }

    /* ---- 劳作检定（疲劳 +6） ---- */
    const mainVal = a[task.main] || 10;
    const pathBonus = (PATHS[adv.path] && PATHS[adv.path].bonus[adv.task]) || 0;
    const profBonus = (adv.profCount[adv.task] >= 10) ? 2 : 0;
    const roll = d(20);
    const total = roll + mainVal + pathBonus + profBonus + E.检定加值;
    const g = grade(total, roll);

    let mult = E.产量倍率 * eff;
    if (adv.task === '伐木') mult *= E.伐木倍率;
    if (adv.task === '耕作') mult *= E.耕作倍率;
    if (adv.task === '掘矿') mult *= E.掘矿倍率;

    const profProd = (adv.profCount[adv.task] >= 10) ? 1.2 : 1.0;
    mult *= profProd;

    let amount = Math.round(task.base * g.m * (0.85 + Math.random() * 0.3) * mult);
    if (g.k === 'F') amount = 0;

    adv.stats.worked++;
    adv.workDays++;
    adv.consecutiveWork++;
    adv.fatigue = clamp(adv.fatigue + 6, 0, 100);
    state.totals.worked++;

    adv.profCount[adv.task] = (adv.profCount[adv.task] || 0) + 1;
    if (!adv.profession && adv.profCount[adv.task] >= 10) {
      adv.profession = adv.task;
      lines.push(`🏆 <b>${adv.name}</b> 在长期「${adv.task}」中成长为<b>专精</b>！`);
    }

    if (amount > 0) {
      gain[task.res] += amount;
      adv.stats.produced[task.res] = (adv.stats.produced[task.res] || 0) + amount;

      if (adv.task === '掘矿' && E.铁等级 > 0) {
        const iron = Math.max(1, Math.round(amount * (0.08 + E.铁等级 * 0.07)));
        gain.铁 += iron;
        adv.stats.produced['铁'] = (adv.stats.produced['铁'] || 0) + iron;
        lines.push(`${task.icon} <b>${adv.name}</b> ${adv.task}【${g.n}】→ ${task.res} +${amount}，铁 +${iron}`);
      } else {
        lines.push(`${task.icon} <b>${adv.name}</b> ${adv.task}【${g.n}】→ ${task.res} +${amount}`);
      }

      if (task.res) maybeCorrupt(adv, '生产', lines, gain, task.res);
    } else {
      lines.push(`${task.icon} <b>${adv.name}</b> ${adv.task}【大失败】一无所获。`);
    }

    if (task.risk && g.k === 'F') {
      const dmg = Math.max(1, Math.round(rnd(3, 8) * E.受伤倍率));
      adv.hp -= dmg;
      adv.mind = Math.max(0, adv.mind - rnd(1, 3));
      adv.stats.injured += dmg;
      state.totals.injured += dmg;
      lines.push(`💥 <b>${adv.name}</b> 遭遇意外，损失 ${dmg} 点生命！`);
    } else if (task.risk && g.k === 'E') {
      const dmg = Math.max(1, Math.round(rnd(1, 3) * E.受伤倍率));
      adv.hp -= dmg;
      adv.stats.injured += dmg;
      state.totals.injured += dmg;
    }

    if (g.m >= 1.9) {
      const up = d(3);
      adv.mind = Math.min(max.mind, adv.mind + up);
      adv.stats.mental += up;
      adv.happiness = clamp(adv.happiness + 2, 0, 100);
    } else if (g.m <= 0.4) {
      const dn = d(3);
      adv.mind = Math.max(0, adv.mind - dn);
      adv.stats.mental -= dn;
      adv.happiness = clamp(adv.happiness - 2, 0, 100);
    }

    if (adv.workDays % 5 === 0) {
      const k = pick(ATTR_KEYS);
      if (adv.baseAttrs[k] < 18) {
        adv.baseAttrs[k]++;
        lines.push(`📈 <b>${adv.name}</b> 在长期劳作中，${k} 提升了 1 点！`);
      }
    }

    if (adv.hp <= 0) {
      adv.hp = 0;
      adv.status = '昏迷';
      adv.task = '休息';
      adv.stats.downed++;
      lines.push(`⚠️ <b>${adv.name}</b> 倒下了，陷入昏迷！`);
    }
  });

  /* ---------- 2. 建筑产出 ---------- */
  if (E.每日食物 > 0) {
    gain.食物 += E.每日食物;
    lines.push(`🌾 农田/畜栏共产出 ${E.每日食物} 单位食物。`);
  }
  if (E.每日石头 > 0) {
    gain.石头 += E.每日石头;
    lines.push(`🗿 傀儡工坊自动产出 ${E.每日石头} 单位石头。`);
  }

  /* ---------- 3. 建筑被动幸福 & 疲劳恢复 ---------- */
  if (E.每日幸福 > 0 || E.疲劳恢复 > 0) {
    state.adventurers.forEach(adv => {
      if (adv.status === '昏迷' || adv.imprisoned > 0) return;
      if (E.每日幸福 > 0) {
        adv.happiness = clamp(adv.happiness + E.每日幸福, 0, 100);
        adv.stats.passiveHappy = (adv.stats.passiveHappy || 0) + E.每日幸福;
      }
      if (E.疲劳恢复 > 0) {
        adv.fatigue = clamp(adv.fatigue - E.疲劳恢复, 0, 100);
      }
    });
    const parts = [];
    if (E.每日幸福 > 0) parts.push(`幸福 +${E.每日幸福}`);
    if (E.疲劳恢复 > 0) parts.push(`疲劳 -${E.疲劳恢复}`);
    lines.push(`🏕 营地设施带来被动恢复：${parts.join('，')}。`);
  }

  /* ---------- 4. 篝火晚会余韵 ---------- */
  if (state.feast.bonusDays > 0) {
    const bonus = 3;
    state.adventurers.forEach(adv => {
      if (adv.status === '昏迷' || adv.imprisoned > 0) return;
      adv.happiness = clamp(adv.happiness + bonus, 0, 100);
      adv.stats.passiveHappy = (adv.stats.passiveHappy || 0) + bonus;
    });
    lines.push(`🎊 篝火晚会余韵仍在，全员幸福 +${bonus}。`);
  }

  /* ---------- 5. 工资（每月结算） ---------- */
  if (pop > 0) {
    const isPayday = state.day % WAGE_PERIOD === 0;

    if (isPayday) {
      let totalNeed = Math.round(totalMonthlyWage() * 10) / 10;
      const paid = Math.min(state.res.金币, totalNeed);
      state.res.金币 -= paid;
      state.totals.wages += paid;

      const ratio = totalNeed > 0 ? paid / totalNeed : 1;

      if (ratio >= 1) {
        lines.push(`💰 【发薪日】全员发放月薪共 ${totalNeed.toFixed(1)} 金币。`);
      } else if (ratio > 0) {
        lines.push(`💰 【发薪日】金币不足，仅发放 ${paid.toFixed(1)} / ${totalNeed.toFixed(1)} 金币（拖欠 ${(totalNeed - paid).toFixed(1)}）。`, 'warn');
      } else {
        lines.push(`💸 【发薪日】金币枯竭，全员未能领到工资！`, 'bad');
      }

      state.adventurers.forEach(adv => {
        const want = monthlyWage(adv);
        const got = Math.round(want * ratio * 10) / 10;
        adv.wallet = Math.round((adv.wallet + got) * 10) / 10;
        adv.stats.wageEarned = Math.round((adv.stats.wageEarned + got) * 10) / 10;

        const tier = WAGE_TIERS[state.wageTier];
        if (ratio >= 1) {
          adv.integrity = clamp(adv.integrity + tier.integrityDelta, 0, 100);
          adv.happiness = clamp(adv.happiness + tier.happyDelta, 0, 100);
        } else {
          adv.happiness = clamp(adv.happiness - 12, 0, 100);
          adv.integrity = clamp(adv.integrity - 12, 0, 100);
        }

        if (got > 0 && Math.random() < 0.25 && adv.inventory.length < 12) {
          const item = pick(PERSONAL_ITEMS);
          if (!adv.inventory.includes(item)) adv.inventory.push(item);
        }
      });
    } else {
      const dtp = daysToPayday();
      if (dtp <= 3) {
        lines.push(`📅 距离发薪日还有 ${dtp} 天。`);
      }
    }
  }

  /* ---------- 6. 个人消费 ---------- */
  state.adventurers.forEach(adv => tryPersonalSpending(adv, lines));

  /* ---------- 7. 疾病 ---------- */
  state.adventurers.forEach(adv => {
    if (!adv.diseases || !adv.diseases.length) return;
    const remaining = [];
    adv.diseases.forEach(dz => {
      const base = DISEASES[dz.name] ? DISEASES[dz.name].cureChance : 0.2;
      const chance = base * E.痊愈加成 * 0.35 + 0.05;
      if (Math.random() < chance) {
        lines.push(`💚 <b>${adv.name}</b> 的${dz.name}自然痊愈了。`);
      } else {
        dz.days--;
        if (dz.days <= 0) {
          lines.push(`💚 <b>${adv.name}</b> 的${dz.name}终于痊愈了。`);
        } else {
          remaining.push(dz);
        }
      }
    });
    adv.diseases = remaining;
  });

  state.adventurers.forEach(src => {
    if (!src.diseases || !src.diseases.length) return;
    src.diseases.forEach(dz => {
      const base = DISEASES[dz.name] ? DISEASES[dz.name].contagion : 0;
      if (base <= 0) return;
      const chance = base * E.传染压制;
      if (Math.random() < chance) {
        const others = state.adventurers.filter(x => x.id !== src.id && !(x.diseases || []).some(z => z.name === dz.name));
        if (others.length) {
          const victim = pick(others);
          victim.diseases.push({ name: dz.name, days: rnd(DISEASES[dz.name].days[0], DISEASES[dz.name].days[1]), severity: dz.severity });
          lines.push(`🦠 <b>${victim.name}</b> 被 <b>${src.name}</b> 传染了${dz.name}！`);
        }
      }
    });
  });

  state.adventurers.forEach(adv => {
    if (adv.status === '昏迷' || adv.imprisoned > 0) return;
    if ((adv.diseases || []).length >= 2) return;

    let chance = 0.015;
    if (adv.fatigue > 70) chance += 0.06;
    if (adv.fatigue > 85) chance += 0.05;
    if (adv.happiness < 30) chance += 0.05;
    if (state.res.食物 === 0) chance += 0.08;
    if (adv.hp < calcMax(adv).hp * 0.4) chance += 0.04;
    if (state.crime.level > 50) chance += 0.03;
    chance *= E.患病压制;

    if (Math.random() < chance) {
      const diseaseNames = Object.keys(DISEASES);
      const weights = diseaseNames.map(n => DISEASES[n].severity === 1 ? 6 : DISEASES[n].severity === 2 ? 3 : 1);
      let total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      let chosen = diseaseNames[0];
      for (let i = 0; i < diseaseNames.length; i++) {
        r -= weights[i];
        if (r <= 0) { chosen = diseaseNames[i]; break; }
      }
      const dz = DISEASES[chosen];
      adv.diseases.push({ name: chosen, days: rnd(dz.days[0], dz.days[1]), severity: dz.severity });
      lines.push(`🤒 <b>${adv.name}</b> 染上了<b>${chosen}</b>！${dz.desc}`);
    }
  });

  /* ---------- 8. 犯罪与盗窃 ---------- */
  let pressure = 0;
  const hungryCount = state.res.食物 === 0 ? pop : 0;
  const unhappyCount = state.adventurers.filter(a => a.happiness < 30).length;
  const tiredCount = state.adventurers.filter(a => a.fatigue > 70).length;
  const corruptCount = state.adventurers.filter(a => a.corruptCount > 0).length;
  pressure += unhappyCount * 2.5;
  pressure += tiredCount * 1.5;
  pressure += hungryCount * 4;
  pressure += corruptCount * 3;
  pressure -= (state.buildings['治安所'] || 0) * 2.5;

  state.crime.level = clamp(state.crime.level + pressure * 0.35, 0, 100);

  const crimeChance = state.crime.level / 100 * 0.35;
  if (state.adventurers.length > 0 && Math.random() < crimeChance) {
    const candidates = state.adventurers.filter(a => a.status !== '昏迷' && a.imprisoned === 0);
    if (candidates.length) {
      candidates.sort((x, y) => {
        const sx = (100 - x.happiness) + x.fatigue + (state.res.食物 === 0 ? 30 : 0) + x.corruptCount * 5;
        const sy = (100 - y.happiness) + y.fatigue + (state.res.食物 === 0 ? 30 : 0) + y.corruptCount * 5;
        return sy - sx;
      });
      const criminal = candidates[0];
      const richTargets = state.adventurers.filter(x => x.id !== criminal.id && x.wallet > 5);
      const useTheft = richTargets.length > 0 && Math.random() < 0.5;

      if (useTheft) {
        richTargets.sort((x, y) => y.wallet - x.wallet);
        const victim = richTargets[0];
        const steal = Math.round(Math.min(victim.wallet, rnd(3, 10)) * 10) / 10;
        victim.wallet = Math.round((victim.wallet - steal) * 10) / 10;
        criminal.wallet = Math.round((criminal.wallet + steal) * 10) / 10;
        victim.stats.lost = Math.round((victim.stats.lost + steal) * 10) / 10;
        criminal.criminal = true;
        criminal.crimeRecord = (criminal.crimeRecord || 0) + 1;
        criminal.stats.crimes = (criminal.stats.crimes || 0) + 1;
        state.crime.totalCrimes++;
        state.crime.criminals++;
        victim.happiness = clamp(victim.happiness - 8, 0, 100);
        lines.push(`🚨 <b>${criminal.name}</b> 盗窃了 <b>${victim.name}</b> 的 ${steal} 金币！`);
      } else {
        const crimeTypes = ['偷窃营地资源', '破坏营地', '斗殴伤人', '走私货品'];
        const crime = pick(crimeTypes);
        state.crime.totalCrimes++;
        state.crime.criminals++;
        criminal.criminal = true;
        criminal.crimeRecord = (criminal.crimeRecord || 0) + 1;
        criminal.stats.crimes = (criminal.stats.crimes || 0) + 1;
        criminal.happiness = clamp(criminal.happiness - 5, 0, 100);

        if (crime === '偷窃营地资源') {
          const steal = {};
          for (const r of Object.keys(state.res)) {
            if (state.res[r] > 0) {
              const amt = Math.min(state.res[r], rnd(2, 8));
              state.res[r] -= amt;
              steal[r] = amt;
            }
          }
          const gold = Object.values(steal).reduce((a, b) => a + b, 0) * 2;
          criminal.wallet = Math.round((criminal.wallet + gold) * 10) / 10;
          const txt = Object.entries(steal).map(([r, v]) => `${r}-${v}`).join('、');
          lines.push(`🚨 <b>${criminal.name}</b> 偷窃营地资源（${txt}），转卖得 ${gold} 金币！`);
        } else if (crime === '破坏营地') {
          if (state.project) {
            const dmg = rnd(3, 10);
            state.project.progress = Math.max(0, state.project.progress - dmg);
            lines.push(`🚨 <b>${criminal.name}</b> 破坏了营地工程（进度 -${dmg}）！`);
          } else {
            lines.push(`🚨 <b>${criminal.name}</b> 试图破坏营地，但未能得逞。`);
          }
        } else if (crime === '斗殴伤人') {
          const others = state.adventurers.filter(x => x.id !== criminal.id && x.status !== '昏迷');
          if (others.length) {
            const victim = pick(others);
            const dmg = rnd(2, 6);
            victim.hp = Math.max(0, victim.hp - dmg);
            victim.stats.injured += dmg;
            state.totals.injured += dmg;
            if (victim.hp <= 0) { victim.status = '昏迷'; victim.task = '休息'; victim.stats.downed++; }
            lines.push(`🚨 <b>${criminal.name}</b> 斗殴打伤了 <b>${victim.name}</b>（-${dmg} 生命）！`);
          } else {
            lines.push(`🚨 <b>${criminal.name}</b> 滋事斗殴，但无人受伤。`);
          }
        } else {
          const amt = rnd(5, 15);
          state.res.金币 = Math.max(0, state.res.金币 - amt);
          criminal.wallet = Math.round((criminal.wallet + amt) * 10) / 10;
          lines.push(`🚨 <b>${criminal.name}</b> 走私货品，营地金币 -${amt}！`);
        }
      }

      const hasGuard = (state.buildings['治安所'] || 0) > 0;
      const patrolCoverage = state.adventurers.filter(x => x.task === '巡逻' && x.imprisoned === 0).length;
      const catchChance = (hasGuard ? 0.5 : 0) + Math.min(0.5, patrolCoverage * 0.25);

      if (Math.random() < catchChance) {
        if (criminal.crimeRecord >= 3) {
          lines.push(`⚖ <b>${criminal.name}</b> 屡次犯罪，被驱逐出据点！`, 'bad');
          state.adventurers = state.adventurers.filter(x => x.id !== criminal.id);
        } else {
          criminal.imprisoned = rnd(2, 4);
          criminal.task = '休息';
          lines.push(`⚖ <b>${criminal.name}</b> 被逮捕，判处监禁 ${criminal.imprisoned} 天。`);
        }
      } else {
        lines.push(`⚖ 据点治安力量不足，<b>${criminal.name}</b> 未被抓获。`);
      }
    }
  }

  state.crime.level = clamp(state.crime.level - 2, 0, 100);

  /* ---------- 9. 食物消耗 ---------- */
  if (pop > 0) {
    const need = Math.max(0, Math.round(pop * 2 - E.食物减免));
    if (state.res.食物 + gain.食物 >= need) {
      const fromGain = Math.min(gain.食物, need);
      gain.食物 -= fromGain;
      const fromStore = need - fromGain;
      state.res.食物 -= fromStore;
      lines.push(`🍖 全员消耗食物 ${need} 单位${E.食物减免 ? `（建筑减免 ${E.食物减免}）` : ''}。`);
    } else {
      const available = state.res.食物 + gain.食物;
      gain.食物 = 0;
      state.res.食物 = 0;
      const shortage = need - available;
      lines.push(`🚨 食物短缺！缺口 ${shortage} 单位，全员挨饿。`);
      state.adventurers.forEach(adv => {
        const hpL = rnd(2, 5), mindL = rnd(1, 3);
        adv.hp = Math.max(0, adv.hp - hpL);
        adv.mind = Math.max(0, adv.mind - mindL);
        adv.happiness = clamp(adv.happiness - 8, 0, 100);
        if (adv.hp <= 0 && adv.status !== '昏迷') {
          adv.status = '昏迷';
          adv.task = '休息';
          adv.stats.downed++;
          lines.push(`⚠️ <b>${adv.name}</b> 因饥饿而倒下。`);
        }
      });
    }
  }

  /* ---------- 10. 入库 ---------- */
  Object.keys(gain).forEach(k => {
    if (gain[k] > 0) {
      state.res[k] = (state.res[k] || 0) + gain[k];
      state.totals.produced[k] = (state.totals.produced[k] || 0) + gain[k];
    }
  });

  /* ---------- 11. 幸福度演变（大幅减轻工作消耗） ---------- */
  const bedCount = E.床位;
  state.adventurers.forEach(adv => {
    if (adv.status === '昏迷') {
      adv.happiness = clamp(adv.happiness - 1, 0, 100);
      return;
    }
    if (adv.imprisoned > 0) {
      adv.happiness = clamp(adv.happiness - 3, 0, 100);
      return;
    }
    let delta = 0;
    if (bedCount >= pop) delta += 5 + (state.buildings['住房'] || 0) * 1;
    else delta -= 12;
    if (state.res.食物 > pop * 4) delta += 4;
    else if (state.res.食物 > pop * 1.5) delta += 1;
    else if (state.res.食物 === 0) delta -= 8;
    // 疲劳惩罚大幅降低
    if (adv.fatigue > 85) delta -= 2;
    else if (adv.fatigue > 70) delta -= 1;
    // 连续工作惩罚大幅降低（每 8 天 +1，最多 -2）
    delta -= Math.min(2, Math.floor(adv.consecutiveWork / 8));
    delta += Math.round(E.幸福度 / Math.max(1, pop));
    if ((adv.diseases || []).length > 0) delta -= (adv.diseases.length * 2);
    if (adv.criminal) delta -= 2;
    if (adv.wallet >= 30) delta += 1;
    if (adv.wallet >= 80) delta += 1;
    if (adv.wallet >= 10 && state.res.食物 > pop * 2) delta += 1;

    adv.happiness = clamp(adv.happiness + delta, 0, 100);

    if (adv.happiness < 15) {
      adv.lowHappyDays++;
      if (adv.lowHappyDays >= 3 && pop > 1) {
        lines.push(`😡 <b>${adv.name}</b> 幸福度长期过低，愤然离开了据点！（带走 ${adv.wallet.toFixed(1)} 金币）`);
        adv._leave = true;
      }
    } else {
      adv.lowHappyDays = 0;
    }
  });
  const leavers = state.adventurers.filter(a => a._leave);
  if (leavers.length) {
    state.adventurers = state.adventurers.filter(a => !a._leave);
    leavers.forEach(a => delete a._leave);
    lines.push(`🚪 ${leavers.map(a => a.name).join('、')} 已离开据点。`);
  }

  /* ---------- 12. 夜袭 ---------- */
  const raidChance = 0.28 * E.夜袭倍率;
  if (state.adventurers.length > 0 && Math.random() < raidChance) {
    const awake = state.adventurers.filter(a => a.status !== '昏迷' && a.imprisoned === 0);
    if (awake.length) {
      const victim = pick(awake);
      const dmg = Math.max(1, Math.round(rnd(3, 10) * E.受伤倍率));
      victim.hp = Math.max(0, victim.hp - dmg);
      victim.mind = Math.max(0, victim.mind - rnd(1, 5));
      victim.happiness = clamp(victim.happiness - 4, 0, 100);
      victim.stats.injured += dmg;
      state.totals.injured += dmg;
      if (victim.hp <= 0) {
        victim.status = '昏迷';
        victim.task = '休息';
        victim.stats.downed++;
      }
      lines.push(`🧟 亡灵夜袭！<b>${victim.name}</b> 在守夜中受伤 ${dmg} 点。`);
    }
  }

  /* ---------- 13. 随机事件 ---------- */
  const ev = rollEvent(pop);
  if (ev) { lines.push(ev); state.totals.events++; }

  /* ---------- 14. 写入日志 ---------- */
  state.day++;
  addLog(`—— 第 ${state.day} 天 ——`, 'day');
  lines.slice().reverse().forEach(l => {
    let t = '';
    if (/🚨|⚖|😡|🚫|💥|🧟|⚠️|🔒|💸/.test(l)) t = 'bad';
    else if (/🤒|🦠|💊|⚕|拖欠/.test(l)) t = 'warn';
    else if (/📈|🎉|💫|✨|🏆|🔓|🎊|🛍|【发薪日】/.test(l)) t = 'epic';
    else if (/🍖|🛏|🔨|🛡|🎭|♨|🌸/.test(l)) t = 'good';
    addLog(l, t);
  });

  render(); save();
}

/* =========================================================
   贪污
   ========================================================= */
function maybeCorrupt(adv, context, lines, gain, resourceKey) {
  const tier = WAGE_TIERS[state.wageTier];
  let chance = (100 - adv.integrity) / 500;
  chance *= tier.corruptMul;
  if (adv.happiness < 30) chance *= 1.5;
  if (state.res.金币 < totalMonthlyWage() * 0.5) chance *= 1.6;
  if (adv.wallet > 50) chance *= 1.2;
  if (adv.corruptCount > 0) chance *= 1.4;

  if (Math.random() >= chance) return;

  adv.corruptCount++;
  adv.integrity = clamp(adv.integrity - 8, 0, 100);
  state.totals.corrupt++;
  adv.stats.corruption++;

  if (context === '建造') {
    const gain2 = rnd(2, 6);
    adv.wallet = Math.round((adv.wallet + gain2) * 10) / 10;
    if (state.project) state.project.progress = Math.max(0, state.project.progress - rnd(1, 3));
    lines.push(`💸 <b>${adv.name}</b> 在建造中虚报材料，私吞 ${gain2} 金币。`, 'warn');
  } else if (context === '生产' && gain && resourceKey) {
    const skim = Math.max(1, Math.round(gain[resourceKey] * 0.15));
    if (gain[resourceKey] >= skim) {
      gain[resourceKey] -= skim;
      const gold = skim * 2;
      adv.wallet = Math.round((adv.wallet + gold) * 10) / 10;
      lines.push(`💸 <b>${adv.name}</b> 从${resourceKey}产出中克扣 ${skim} 单位，转卖得 ${gold} 金币。`, 'warn');
    }
  }

  if (Math.random() < 0.25) {
    adv.happiness = clamp(adv.happiness - 8, 0, 100);
    lines.push(`👀 有人察觉了 <b>${adv.name}</b> 的不轨行为，其名誉受损。`, 'warn');
    if ((state.buildings['治安所'] || 0) > 0) {
      adv.imprisoned = rnd(1, 2);
      adv.task = '休息';
      lines.push(`⚖ <b>${adv.name}</b> 因贪污被捕，监禁 ${adv.imprisoned} 天。`, 'bad');
    }
  }
}

/* =========================================================
   动态事件
   ========================================================= */
function rollEvent(pop) {
  if (Math.random() > 0.34) return null;
  const day = state.day;

  const pool = [];
  const add = (w, fn) => { for (let i = 0; i < w; i++) pool.push(fn); };

  add(3, () => {
    const g = rnd(10, 25);
    state.res.金币 += g;
    return `💰 商队路过据点，交易获利 ${g} 金币。`;
  });
  add(3, () => {
    const g = rnd(6, 14);
    state.res.食物 += g;
    return `🌾 附近村民送来谢礼，食物 +${g}。`;
  });
  add(2, () => {
    const g = rnd(4, 10);
    state.res.木材 += g;
    return `🌲 风暴刮倒了几棵树，木材 +${g}。`;
  });
  add(2, () => {
    const g = rnd(2, 5);
    state.res.铁 += g;
    return `⛓ 在废弃矿道中翻出旧铁料，铁 +${g}。`;
  });
  add(1, () => {
    const g = rnd(1, 3);
    state.res.绿宝石 += g;
    return `💚 矿洞深处发现蕴魔水晶，绿宝石 +${g}。`;
  });
  add(2, () => {
    const g = rnd(1, 2);
    state.res.绿宝石 += g;
    return `🌿 采集到一些炼金药材，绿宝石 +${g}（可用于行医）。`;
  });

  if (pop > 0) {
    add(3, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      const max = calcMax(adv);
      const up = rnd(2, 6);
      adv.mind = Math.min(max.mind, adv.mind + up);
      adv.happiness = clamp(adv.happiness + 3, 0, 100);
      adv.stats.mental += up;
      return `✨ <b>${adv.name}</b> 在篝火旁讲了个好故事，全队士气回升。`;
    });
    add(2, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      const max = calcMax(adv);
      const up = rnd(3, 8);
      const before = adv.hp;
      adv.hp = Math.min(max.hp, adv.hp + up);
      adv.stats.healed = (adv.stats.healed || 0) + (adv.hp - before);
      return `🌿 <b>${adv.name}</b> 采到一些草药，生命 +${adv.hp - before}。`;
    });
    add(2, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      const g = rnd(3, 10);
      adv.wallet = Math.round((adv.wallet + g) * 10) / 10;
      return `💼 <b>${adv.name}</b> 出售了一些旧物，个人金币 +${g}。`;
    });
    add(1, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      if (adv.inventory.length >= 12) return null;
      const item = pick(PERSONAL_ITEMS);
      if (adv.inventory.includes(item)) return null;
      adv.inventory.push(item);
      return `🎁 <b>${adv.name}</b> 获得了一件私人收藏：${item}。`;
    });
    add(2, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      const up = rnd(4, 10);
      adv.happiness = clamp(adv.happiness + up, 0, 100);
      adv.stats.passiveHappy = (adv.stats.passiveHappy || 0) + up;
      return `🌞 <b>${adv.name}</b> 在河边钓了半天鱼，心情舒畅（幸福 +${up}）。`;
    });
  }

  if (pop >= 4) {
    add(3, () => {
      const g = rnd(20, 40);
      state.res.金币 += g;
      return `🏰 冒险队在附近遗迹中取得收获，金币 +${g}。`;
    });
    add(2, () => {
      const g = rnd(3, 7);
      state.res.铁 += g;
      return `⛏ 冒险队清理了一处废弃矿脉，铁 +${g}。`;
    });
  }

  if (pop >= 6 && day > 10) {
    add(2, () => {
      const g = rnd(30, 60);
      state.res.金币 += g;
      return `🛤 据点与远方城镇建立了稳定商路，金币 +${g}。`;
    });
    add(1, () => {
      const g = rnd(2, 4);
      state.res.绿宝石 += g;
      return `💎 远方商人以绿宝石作为报酬，绿宝石 +${g}。`;
    });
  }

  if (pop > 0 && day > 5) {
    const disasterW = Math.min(4, Math.floor(pop / 2) + 1);
    add(disasterW, () => {
      const adv = pick(state.adventurers);
      if (adv.status === '昏迷' || adv.imprisoned > 0) return null;
      const E = campEffects();
      const dmg = Math.max(1, Math.round(rnd(3, 9) * E.受伤倍率));
      adv.hp = Math.max(0, adv.hp - dmg);
      adv.mind = Math.max(0, adv.mind - rnd(2, 5));
      adv.happiness = clamp(adv.happiness - 5, 0, 100);
      adv.stats.injured += dmg;
      state.totals.injured += dmg;
      if (adv.hp <= 0) {
        adv.status = '昏迷';
        adv.task = '休息';
        adv.stats.downed++;
      }
      return `🧟 亡灵群袭扰据点！<b>${adv.name}</b> 受伤 ${dmg} 点。`;
    });
  }

  if (day > 12 && pop >= 5) {
    add(1, () => {
      const victim = pick(state.adventurers.filter(a => a.status !== '昏迷' && a.imprisoned === 0));
      if (!victim) return null;
      if ((victim.diseases || []).some(d => d.name === '瘟疫')) return null;
      victim.diseases.push({ name: '瘟疫', days: rnd(6, 10), severity: 3 });
      return `🦠 一场瘟疫在据点附近爆发，<b>${victim.name}</b> 不幸染病！唯有炼金术士能回天。`;
    });
  }

  if (state.adventurers.filter(a => a.wallet >= 30).length > 0 && day > 6) {
    add(1, () => {
      const rich = state.adventurers.filter(a => a.wallet >= 30);
      const victim = pick(rich);
      const thief = pick(state.adventurers.filter(a => a.id !== victim.id && a.status !== '昏迷'));
      if (!thief) return null;
      const steal = Math.round(Math.min(victim.wallet, rnd(3, 12)) * 10) / 10;
      victim.wallet = Math.round((victim.wallet - steal) * 10) / 10;
      thief.wallet = Math.round((thief.wallet + steal) * 10) / 10;
      return `🕵 一名游荡的小偷潜入据点，偷走了 <b>${victim.name}</b> 的 ${steal} 金币！`;
    });
  }

  if (pool.length === 0) return null;
  return pick(pool)();
}

/* =========================================================
   统计
   ========================================================= */
function openStats() {
  const g = state.totals || { produced: {}, injured: 0, worked: 0, events: 0, wages: 0, corrupt: 0, feasts: 0 };
  const prod = Object.entries(g.produced || {}).map(([k, v]) => `${k} +${v}`).join(' · ') || '暂无';
  const sick = state.adventurers.filter(a => (a.diseases || []).length > 0).length;
  const criminals = state.adventurers.filter(a => a.criminal).length;
  const totalWallet = state.adventurers.reduce((s, a) => s + a.wallet, 0);
  const corruptCount = state.adventurers.filter(a => a.corruptCount > 0).length;
  const avgHappy = state.adventurers.length
    ? Math.round(state.adventurers.reduce((s, a) => s + a.happiness, 0) / state.adventurers.length)
    : 0;

  let html = `
    <div class="stat-summary">
      <div><span>据点天数</span><b>${state.day}</b></div>
      <div><span>冒险者人数</span><b>${state.adventurers.length}</b></div>
      <div><span>平均幸福</span><b>${avgHappy}</b></div>
      <div><span>篝火晚会</span><b>${g.feasts || 0}</b></div>
      <div><span>累计工资</span><b>${Math.round(g.wages || 0)}</b></div>
      <div><span>个人财富总额</span><b>${Math.round(totalWallet)}</b></div>
      <div><span>累计贪污</span><b>${g.corrupt || 0}</b></div>
      <div><span>当前犯罪率</span><b>${Math.round(state.crime.level)}</b></div>
      <div><span>当前患病</span><b>${sick}</b></div>
      <div><span>犯罪记录者</span><b>${criminals}</b></div>
      <div><span>有贪污者</span><b>${corruptCount}</b></div>
      <div><span>已建建筑</span><b>${Object.keys(state.buildings).length} / ${Object.keys(BUILDINGS).length}</b></div>
      <div style="grid-column:1/-1;"><span>据点累计产出</span><b>${prod}</b></div>
    </div>
  `;

  if (!state.adventurers.length) {
    html += `<div class="empty">还没有冒险者可以统计。</div>`;
    $('#statsBody').innerHTML = html;
    $('#statsMask').classList.add('on');
    return;
  }

  state.adventurers.forEach(adv => {
    const st = adv.stats || emptyStats();
    const init = adv.initialAttrs || adv.baseAttrs || {};
    const prodList = Object.entries(st.produced || {}).map(([k, v]) => `${k}+${v}`).join(' ') || '—';
    const profList = Object.entries(adv.profCount || {})
      .filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `${k}×${v}`).join(' · ') || '—';
    const dzList = (adv.diseases || []).map(d => `${d.name}(${d.days}天)`).join('、') || '—';
    const invList = (adv.inventory || []).join('、') || '（行囊空空）';

    const rows = ATTR_KEYS.map(k => {
      const v0 = init[k] ?? 10;
      const v1 = adv.baseAttrs[k] ?? 10;
      const dv = v1 - v0;
      const dtxt = dv === 0 ? '—'
        : dv > 0 ? `<span class="up">+${dv}</span>`
        : `<span class="down">${dv}</span>`;
      return `<tr><td>${ATTR_ICON[k]} ${k}</td><td>${v0}</td><td><b>${v1}</b></td><td>${dtxt}</td></tr>`;
    }).join('');

    const m = calcMax(adv);
    html += `
      <div class="stat-card">
        <div class="stat-name">${adv.name}
          <span>${adv.race} · ${adv.path}${adv.profession ? ` · 专精「${adv.profession}」` : ''}${adv.status === '昏迷' ? ' · 昏迷中' : ''}${adv.criminal ? ' · 罪犯' : ''}${adv.imprisoned > 0 ? ` · 监禁${adv.imprisoned}天` : ''}</span>
        </div>
        <table class="stat-table">
          <thead><tr><th>属性</th><th>初始</th><th>当前</th><th>变动</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="stat-foot">
          <span>💰 个人金币 <b>${adv.wallet.toFixed(1)}</b></span>
          <span>月薪 <b>${monthlyWage(adv).toFixed(1)}</b></span>
          <span>诚信 <b>${Math.round(adv.integrity)}</b></span>
          <span>累计工资 <b>${Math.round(st.wageEarned || 0)}</b></span>
          <span>个人消费 <b>${Math.round(st.spent || 0)}</b></span>
          <span>幸福恢复 <b>${Math.round((st.feastHappy || 0) + (st.passiveHappy || 0))}</b></span>
          <span>贪污 <b>${adv.corruptCount || 0}</b></span>
          <span>娱乐 <b>${st.entertaining || 0}</b></span>
          <span>治病 <b>${st.cured || 0}</b></span>
          <span>受伤 <b>${st.injured || 0}</b></span>
          <span>生命 <b>${adv.hp}/${m.hp}</b></span>
          <span>心理 <b>${adv.mind}/${m.mind}</b></span>
          <span>幸福 <b>${Math.round(adv.happiness || 0)}</b></span>
          <span>疲劳 <b>${Math.round(adv.fatigue || 0)}</b></span>
          <span style="flex-basis:100%;">疾病：${dzList}</span>
          <span style="flex-basis:100%;">私人藏品：${invList}</span>
          <span style="flex-basis:100%;">个人产出：${prodList}</span>
          <span style="flex-basis:100%;">任务阅历：${profList}</span>
        </div>
      </div>
    `;
  });

  $('#statsBody').innerHTML = html;
  $('#statsMask').classList.add('on');
}

/* =========================================================
   存档
   ========================================================= */
function exportSave() {
  try {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `MC冒险者模拟器_第${state.day}天_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    addLog('💾 存档已导出。', 'good');
    renderLog(); save();
  } catch (e) {
    alert('导出失败：' + e.message);
  }
}

function migrate(raw) {
  const base = defaultState();
  const s = Object.assign({}, base, raw);
  s.res = Object.assign({}, base.res, raw.res || {});

  const ob = raw.buildings || {};
  s.buildings = {};
  for (const [k, v] of Object.entries(ob)) {
    if (!BUILDINGS[k]) continue;
    if (v === true) s.buildings[k] = 1;
    else if (typeof v === 'number' && v > 0) s.buildings[k] = Math.min(5, Math.floor(v));
  }

  s.project = raw.project || null;
  if (s.project) {
    if (!s.project.targetLevel) s.project.targetLevel = (s.buildings[s.project.key] || 0) + 1;
    if (!s.project.required) s.project.required = buildingWork(s.project.key, s.project.targetLevel);
    if (typeof s.project.progress !== 'number' || isNaN(s.project.progress)) s.project.progress = 0;
  }

  s.log = raw.log || [];
  s.totals = Object.assign({ produced: {}, injured: 0, worked: 0, events: 0, wages: 0, corrupt: 0, feasts: 0 }, raw.totals || {});
  s.totals.produced = (raw.totals && raw.totals.produced) || {};
  s.crime = Object.assign({ level: 0, totalCrimes: 0, criminals: 0 }, raw.crime || {});
  s.wageTier = typeof raw.wageTier === 'number' ? clamp(raw.wageTier, 0, 3) : 2;

  s.feast = Object.assign({ cooldown: 0, lastDay: -99, bonusDays: 0 }, raw.feast || {});
  if (typeof s.feast.cooldown !== 'number' || isNaN(s.feast.cooldown)) s.feast.cooldown = 0;
  if (typeof s.feast.bonusDays !== 'number' || isNaN(s.feast.bonusDays)) s.feast.bonusDays = 0;
  if (typeof s.feast.lastDay !== 'number') s.feast.lastDay = -99;

  s.adventurers = (raw.adventurers || []).map(a => {
    const adv = Object.assign({
      task: '休息', status: '正常', workDays: 0,
      baseAttrs: {}, stats: emptyStats(),
      happiness: 60, fatigue: 0, consecutiveWork: 0,
      profession: null, profCount: {}, lowHappyDays: 0,
      diseases: [], criminal: false, imprisoned: 0, crimeRecord: 0,
      wallet: 0, inventory: [], integrity: 60, corruptCount: 0
    }, a);
    adv.baseAttrs = a.baseAttrs || {};
    adv.initialAttrs = a.initialAttrs || Object.assign({}, adv.baseAttrs);
    adv.stats = Object.assign(emptyStats(), a.stats || {});
    adv.stats.produced = (a.stats && a.stats.produced) || {};
    adv.profCount = a.profCount || {};
    adv.diseases = (a.diseases || []).map(dz => {
      const def = DISEASES[dz.name] || DISEASES['感冒'];
      return {
        name: dz.name,
        days: typeof dz.days === 'number' && !isNaN(dz.days) ? dz.days : rnd(def.days[0], def.days[1]),
        severity: dz.severity || def.severity
      };
    });
    adv.criminal = !!a.criminal;
    adv.imprisoned = typeof a.imprisoned === 'number' ? a.imprisoned : 0;
    adv.crimeRecord = a.crimeRecord || 0;
    adv.wallet = typeof a.wallet === 'number' && !isNaN(a.wallet) ? a.wallet : 0;
    adv.inventory = Array.isArray(a.inventory) ? a.inventory.slice(0, 15) : [];
    adv.integrity = typeof a.integrity === 'number' && !isNaN(a.integrity) ? a.integrity : 60;
    adv.corruptCount = typeof a.corruptCount === 'number' ? a.corruptCount : 0;
    if (typeof adv.stats.spent !== 'number') adv.stats.spent = 0;
    if (typeof adv.stats.feastHappy !== 'number') adv.stats.feastHappy = 0;
    if (typeof adv.stats.passiveHappy !== 'number') adv.stats.passiveHappy = 0;

    const m = calcMax(adv);
    if (typeof adv.hp !== 'number' || isNaN(adv.hp) || !isFinite(adv.hp)) {
      adv.hp = adv.status === '昏迷' ? 0 : m.hp;
    }
    if (typeof adv.mind !== 'number' || isNaN(adv.mind) || !isFinite(adv.mind)) {
      adv.mind = adv.status === '昏迷' ? 0 : m.mind;
    }
    adv.hp = clamp(adv.hp, 0, m.hp);
    adv.mind = clamp(adv.mind, 0, m.mind);
    if (typeof adv.happiness !== 'number' || isNaN(adv.happiness)) adv.happiness = 60;
    if (typeof adv.fatigue !== 'number' || isNaN(adv.fatigue)) adv.fatigue = 0;
    if (typeof adv.consecutiveWork !== 'number' || isNaN(adv.consecutiveWork)) adv.consecutiveWork = 0;
    if (typeof adv.lowHappyDays !== 'number' || isNaN(adv.lowHappyDays)) adv.lowHappyDays = 0;
    return adv;
  });
  return s;
}

function importSave(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = JSON.parse(e.target.result);
      if (!raw || !Array.isArray(raw.adventurers)) {
        throw new Error('文件内容不是有效的存档（缺少 adventurers 字段）');
      }
      state = migrate(raw);
      save();
      render();
      addLog(`📂 已导入存档：第 ${state.day} 天，${state.adventurers.length} 名冒险者。`, 'good');
      renderLog(); save();
      alert(`导入成功！\n当前进度：第 ${state.day} 天，${state.adventurers.length} 名冒险者。`);
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.onerror = () => alert('读取文件失败，请重试。');
  reader.readAsText(file, 'utf-8');
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { }
}
function load() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      for (const k of LEGACY_KEYS) {
        raw = localStorage.getItem(k);
        if (raw) break;
      }
    }
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.adventurers) && s.res) return migrate(s);
    }
  } catch (e) { }
  return null;
}

/* =========================================================
   初始化
   ========================================================= */
function bootstrap() {
  state = load();
  if (!state) {
    state = defaultState();
    const seeds = [
      ['艾琳娜', '人类', '神秘使'],
      ['格罗姆', '骷髅', '受契之人'],
      ['缇娅', '猪灵', '炼金术士'],
      ['布洛姆', '人类', '凡俗者'],
      ['薇拉', '猪灵', '神秘使']
    ];
    seeds.forEach(([n, r, p]) => {
      const adv = newAdventurer(n, r, p, rollBaseAttrs());
      if (Math.random() < 0.6) adv.inventory.push(pick(PERSONAL_ITEMS));
      state.adventurers.push(adv);
    });
    addLog('🏕 你在主世界边缘建立了一处小小据点，冒险者们慕名而来。', 'epic');
    addLog('提示：月薪制（每人约 8~12 金/月）。工作消耗已大幅降低，每月休息 8 日即可抵消 22 日劳作。', '');
    save();
  }

  initModalSelects();
  render();

  $('#btnRecruit').addEventListener('click', recruit);
  $('#btnNext').addEventListener('click', nextDay);
  $('#btnStats').addEventListener('click', openStats);
  $('#btnFeast').addEventListener('click', holdFeast);
  $('#btnExport').addEventListener('click', exportSave);
  $('#btnImport').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', e => {
    importSave(e.target.files[0]);
    e.target.value = '';
  });

  $('#wageSlider').addEventListener('input', e => {
    state.wageTier = parseInt(e.target.value);
    render();
    save();
  });

  $('#btnRoll').addEventListener('click', () => {
    writeBaseToInputs(rollBaseAttrs());
    updatePreview();
  });
  $('#btnPointBuy').addEventListener('click', () => {
    const base = {};
    let left = 96;
    ATTR_KEYS.forEach((k, i) => {
      const rest = ATTR_KEYS.length - i - 1;
      const avg = Math.floor(left / (rest + 1));
      base[k] = clamp(avg + rnd(-2, 2), 6, 18);
      left -= base[k];
    });
    let i = 0;
    while (left !== 0 && i < 200) {
      const k = ATTR_KEYS[i % 8];
      if (left > 0 && base[k] < 18) { base[k]++; left--; }
      else if (left < 0 && base[k] > 6) { base[k]--; left++; }
      i++;
    }
    writeBaseToInputs(base);
    updatePreview();
  });

  $('#btnCancel').addEventListener('click', closeModal);
  $('#btnSave').addEventListener('click', saveAdv);
  $('#btnStatsClose').addEventListener('click', () => $('#statsMask').classList.remove('on'));
  $('#statsMask').addEventListener('click', e => { if (e.target.id === 'statsMask') $('#statsMask').classList.remove('on'); });
  $('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); $('#statsMask').classList.remove('on'); }
  });

  $('#btnReset').addEventListener('click', () => {
    if (!confirm('确定要清空全部进度并重新开始吗？\n建议先导出存档备份。')) return;
    localStorage.removeItem(SAVE_KEY);
    LEGACY_KEYS.forEach(k => localStorage.removeItem(k));
    state = null;
    bootstrap();
  });
}

bootstrap();
</script>
